name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Windows ${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, browser, hardware]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Provision pinned toolchains and dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright'
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" >> $env:GITHUB_ENV
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          npm ci
          cargo fetch --locked --manifest-path bridge/rust/Cargo.toml
          if ('${{ matrix.suite }}' -ne 'hardware') { npx --no-install playwright install chromium }
          if ('${{ matrix.suite }}' -eq 'hardware') {
            $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.5.4-win-x64.zip'
            $uri = 'https://github.com/PowerShell/PowerShell/releases/download/v7.5.4'
            Invoke-WebRequest "$uri/PowerShell-7.5.4-win-x64.zip" -OutFile $archive
            Invoke-WebRequest "$uri/hashes.sha256" -OutFile "$archive.sha256"
            $expected = (Get-Content "$archive.sha256" | Where-Object { $_ -match '\s\*?PowerShell-7\.5\.4-win-x64\.zip$' }) -split '\s+'
            if ($expected.Count -ne 2 -or (Get-FileHash $archive).Hash -ine $expected[0]) { throw 'PowerShell checksum mismatch' }
            $destination = Join-Path $env:RUNNER_TEMP 'powershell-7.5.4'
            Expand-Archive $archive $destination
            $destination | Out-File $env:GITHUB_PATH -Append
          }
      - name: Run project gates without outbound network
        run: |
          $ErrorActionPreference = 'Stop'
          # Dedicated hosted VM has no attached HID and receives no production secrets.
          $profiles = Get-NetFirewallProfile
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $rule = New-NetFirewallRule -DisplayName 'Peripheral CI offline phase' -Direction Outbound -Action Block -RemoteAddress Any
          try {
            if ('${{ matrix.suite }}' -eq 'hardware' -and $PSVersionTable.PSVersion.ToString() -ne '7.5.4') { throw 'Expected PowerShell 7.5.4' }
            ./scripts/ci.ps1 -Suite '${{ matrix.suite }}'
          } finally {
            $rule | Remove-NetFirewallRule
            $profiles | ForEach-Object { Set-NetFirewallProfile -Profile $_.Name -Enabled $_.Enabled }
          }
      - name: Preserve receipts and failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.suite }}-evidence
          path: test-results/ci/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Advisory and license reports
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Provision scanners
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory test-results/ci/dependencies -Force | Out-Null
          rustup toolchain install 1.100.0 --profile minimal
          npm ci --ignore-scripts
          cargo fetch --locked --manifest-path bridge/rust/Cargo.toml
          cargo install cargo-deny --version 0.18.4 --locked
      - name: Scan all npm dependencies
        if: success()
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content test-results/ci/dependencies/npm-audit-time.txt
          npm query '*' > test-results/ci/dependencies/npm-licenses.json
          if ($LASTEXITCODE -ne 0) { throw 'npm license inventory failed' }
          npm audit --json > test-results/ci/dependencies/npm-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'npm advisory scan failed; inspect npm-audit.json' }
      - name: Scan Rust advisories and licenses
        if: '!cancelled()'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo deny --manifest-path bridge/rust/Cargo.toml fetch
          (Get-Date).ToUniversalTime().ToString('o') | Set-Content test-results/ci/dependencies/rust-advisory-time.txt
          Get-ChildItem advisory-db-cache -Directory -Recurse -Force | Where-Object Name -eq '.git' | ForEach-Object {
            git -C $_.Parent.FullName log -1 --format='%H %cI' >> test-results/ci/dependencies/rust-advisory-revisions.txt
          }
          cargo deny --manifest-path bridge/rust/Cargo.toml --locked --format json check --disable-fetch advisories licenses sources *> test-results/ci/dependencies/cargo-deny.jsonl
      - name: Preserve dependency reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-reports
          path: test-results/ci/dependencies/
          if-no-files-found: error
          retention-days: 14
