name: CI refusal proof

on:
  push:
    branches: [codex/m1-ci-negative-proof]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  refusal:
    name: Reject ${{ matrix.case }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: fixture
            suite: core
          - case: binary
            suite: core
          - case: browser
            suite: browser
    env:
      CI: 'true'
      CI_REFUSAL_CASE: ${{ matrix.case }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Provision pinned toolchains and dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright'
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" >> $env:GITHUB_ENV
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          npm ci
          cargo fetch --locked --manifest-path bridge/rust/Cargo.toml
          npx --no-install playwright install chromium
      - name: Run project gates with direct outbound TCP blocked
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:CI_REFUSAL_CASE -eq 'fixture') {
            node -e "const fs = require('node:fs'); const p = 'tests/fixtures/companion-contract.json'; const f = JSON.parse(fs.readFileSync(p)); const row = f.wire.find(row => row.id === 'pair'); if (row.legacy.status !== 200) throw Error('Unexpected pair status'); row.legacy.status = 599; fs.writeFileSync(p, JSON.stringify(f));"
          }
          if ($env:CI_REFUSAL_CASE -eq 'browser') {
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP ('missing-playwright-' + [guid]::NewGuid())
            $env:CHROME_PATH = ''
            if (Test-Path -LiteralPath $env:PLAYWRIGHT_BROWSERS_PATH) { throw 'Refusal browser path already exists' }
          }
          ./scripts/ci-network.ps1 -Suite '${{ matrix.suite }}'
      - name: Preserve receipts and failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refusal-${{ matrix.case }}-evidence
          path: test-results/ci/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 14
