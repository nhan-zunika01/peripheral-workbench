name: T00 disconnect feasibility

# A new workflow cannot be manually dispatched before it exists on the default
# branch. Each reviewed experimental branch selects its own scenario.
on:
  push:
    branches: [codex/t00-offline-spike, codex/t00-preflight]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  spike:
    name: Experimental T00 ${{ matrix.scenario }}
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ github.ref == 'refs/heads/codex/t00-preflight' && fromJSON('["connected-preflight"]') || fromJSON('["normal","supervisor-death"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Provision locked npm packages for Chromium
        if: matrix.scenario == 'connected-preflight'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --quiet HEAD -- package-lock.json
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          git diff --quiet HEAD -- package-lock.json
      - name: Provision pinned PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.5.4-win-x64.zip'
          $uri = 'https://github.com/PowerShell/PowerShell/releases/download/v7.5.4'
          Invoke-WebRequest "$uri/PowerShell-7.5.4-win-x64.zip" -OutFile $archive
          Invoke-WebRequest "$uri/hashes.sha256" -OutFile "$archive.sha256"
          $expected = (Get-Content "$archive.sha256" | Where-Object { $_ -match '\s\*?PowerShell-7\.5\.4-win-x64\.zip$' }) -split '\s+'
          if ($expected.Count -ne 2 -or (Get-FileHash $archive).Hash -ine $expected[0]) { throw 'PowerShell checksum mismatch' }
          $destination = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) ('T00-PowerShell-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $destination | Out-Null
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner([Security.Principal.SecurityIdentifier]'S-1-5-32-544')
          foreach ($entry in @(@('S-1-5-18','FullControl'), @('S-1-5-32-544','FullControl'), @('S-1-5-32-545','ReadAndExecute'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]$entry[0], $entry[1], 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
          }
          Set-Acl -LiteralPath $destination -AclObject $acl
          Expand-Archive $archive $destination
          $destination | Out-File $env:GITHUB_PATH -Append
      - name: Check controller with mocked platform operations
        run: ./tests/ci-disconnect-spike-check.ps1
      - name: Run experimental scenario
        run: |
          if ($PSVersionTable.PSVersion.ToString() -ne '7.5.4') { throw 'Expected pinned PowerShell 7.5.4' }
          ./scripts/ci-disconnect-spike.ps1 -Scenario '${{ matrix.scenario }}' -Output 'test-results/t00-spike'
      - name: Record runner continuation
        if: always()
        run: |
          New-Item -ItemType Directory 'test-results/t00-spike' -Force | Out-Null
          @{ continuedUtc = [DateTime]::UtcNow.ToString('o'); scenario = '${{ matrix.scenario }}'; commit = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content 'test-results/t00-spike/runner-continuation.json'
      - name: Preserve experimental receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.scenario == 'connected-preflight' && 't00-connected-preparation' || format('t00-feasibility-{0}', matrix.scenario) }}
          path: test-results/t00-spike/
          if-no-files-found: error
          retention-days: 14
