[package]
name = "razer-hid-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "signal", "macros", "net", "io-util", "test-util"] }
url = "=2.5.8"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
subtle = "=2.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice", "Win32_System_Registry", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[[bin]]
name = "razer-companion"
path = "src/bin/razer-companion.rs"

[[bin]]
name = "lifecycle-fixture"
path = "tests/support/lifecycle_fixture.rs"
test = false

[[test]]
name = "contract-server"
path = "tests/support/contract_server.rs"
harness = false
